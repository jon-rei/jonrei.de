on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true
      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: 1.108.2
        run: |
          curl -sfSL --retry 3 -o /tmp/dart-sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -xzf /tmp/dart-sass.tar.gz -C /tmp
          echo "/tmp/dart-sass" >> "$GITHUB_PATH"
      - name: Build site with Hugo
        run: hugo --minify
      - name: rsync deployments
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: /public/
          remote_path: jonrei.de
          remote_host: ${{ secrets.RSYNC_HOST }}
          remote_user: ${{ secrets.RSYNC_USER }}
          remote_key: ${{ secrets.RSYNC_DEPLOY_KEY }}
          strict_hostkeys_checking: true
